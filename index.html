:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1115;--card:#2a1a20;--tx:#f5eef0;--mu:#b9a9ae}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:20px 20px 40px;text-align:center}
.top{display:flex;justify-content:flex-end}
.ic{width:48px;height:48px;border:0;border-radius:50%;background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px #0002}
.ic:focus-visible,.card:focus-visible,.so a:focus-visible{outline:3px solid var(--bd);outline-offset:2px}
.av{width:140px;height:140px;border-radius:50%;background:var(--bd) var(--logo) center/62% no-repeat;margin:48px auto 22px}
h1{font-size:34px;margin:0 0 6px;letter-spacing:-.5px}
.tg{margin:0;font-size:17px;letter-spacing:.3px}.tg2{margin:6px 0 0;font-size:20px;font-weight:600;letter-spacing:.3px}
.so{display:flex;justify-content:center;gap:22px;margin:22px 0 40px}
.so a{color:var(--tx);width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.so svg{width:36px;height:36px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.so a{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both,fl 3s ease-in-out infinite}
.so a:nth-child(1){animation-delay:.1s,1s}.so a:nth-child(2){animation-delay:.25s,1.4s}.so a:nth-child(3){animation-delay:.4s,1.8s}
.so a:hover svg,.so a:focus-visible svg{transform:scale(1.25) rotate(-8deg)}
.so a:active svg{transform:scale(.9)}
.so a:nth-child(1):hover{color:#e1306c}.so a:nth-child(2):hover{color:#1877f2}.so a:nth-child(3):hover{color:#fe2c55}
@keyframes pop{from{opacity:0;transform:scale(.3) translateY(16px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:12px;margin:0 0 14px;color:var(--tx);text-decoration:none;font-weight:600;font-size:18px;min-height:96px;transition:transform .15s}
.card:hover{transform:scale(1.015)}
.th{width:72px;height:72px;border-radius:8px;background:center/cover no-repeat;display:grid;place-items:center;color:#fff;font-size:34px}
.dots{border:0;background:none;color:var(--mu);width:40px;height:48px;font-size:22px;cursor:pointer}
.ft{margin-top:44px;color:var(--mu);font-size:14px}
@media(prefers-reduced-motion:reduce){.card{transition:none}.so a{animation:none}.so svg{transition:none}}
